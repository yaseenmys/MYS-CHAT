// ---------- MINI CHECKERS ----------
gameFunctions.checkers = function() {
  // Simple 6x6 mini checkers
  const SIZE = 6;
  let board, turn, selected;

  setStats(`<div class="stat-box"><div class="label">Turn</div><div class="value" id="ckT">You</div></div>`);
  setContainer(`<div id="ckBoard" style="display:grid;grid-template-columns:repeat(6,1fr);gap:2px;max-width:360px;margin:15px auto;background:#8e2de2;padding:6px;border-radius:12px;"></div><button class="btn-action" id="ckReset">New Game</button>`);

  function reset() {
    board = Array(SIZE).fill().map(() => Array(SIZE).fill(0));
    // Place pieces
    for (let i = 0; i < SIZE; i++) for (let j = 0; j < SIZE; j++) {
      if ((i + j) % 2 === 1) {
        if (i < 2) board[i][j] = 2; // CPU
        else if (i > 3) board[i][j] = 1; // Player
      }
    }
    turn = 1;
    selected = null;
    document.getElementById('ckT').textContent = 'You';
    render();
  }

  function render() {
    const b = document.getElementById('ckBoard');
    b.innerHTML = '';
    for (let i = 0; i < SIZE; i++) for (let j = 0; j < SIZE; j++) {
      const cell = document.createElement('div');
      const isDark = (i + j) % 2 === 1;
      cell.style.cssText = `aspect-ratio:1;background:${isDark ? '#3a2a5e' : '#6a5a9e'};border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:${isDark?'pointer':'default'};font-size:24px;`;
      if (selected && selected[0] === i && selected[1] === j) cell.style.outline = '3px solid #00ffff';
      if (board[i][j] === 1) cell.innerHTML = '<div style="width:70%;height:70%;background:#ff0055;border-radius:50%;box-shadow:0 0 10px #ff0055;"></div>';
      if (board[i][j] === 2) cell.innerHTML = '<div style="width:70%;height:70%;background:#ffd93d;border-radius:50%;box-shadow:0 0 10px #ffd93d;"></div>';
      cell.onclick = () => click(i, j);
      b.appendChild(cell);
    }
  }

  function click(i, j) {
    if (turn !== 1) return;
    if (board[i][j] === 1) { selected = [i, j]; render(); return; }
    if (selected) {
      const [si, sj] = selected;
      const di = i - si, dj = j - sj;
      if (Math.abs(di) === 1 && Math.abs(dj) === 1 && board[i][j] === 0) {
        board[i][j] = 1; board[si][sj] = 0;
        selected = null;
        turn = 2;
        document.getElementById('ckT').textContent = 'CPU';
        render();
        setTimeout(cpuMove, 500);
      } else if (Math.abs(di) === 2 && Math.abs(dj) === 2 && board[i][j] === 0) {
        const mi = si + di/2, mj = sj + dj/2;
        if (board[mi][mj] === 2) {
          board[i][j] = 1; board[si][sj] = 0; board[mi][mj] = 0;
          selected = null;
          turn = 2;
          document.getElementById('ckT').textContent = 'CPU';
          render();
          setTimeout(cpuMove, 500);
        }
      }
    }
  }

  function cpuMove() {
    // Find any CPU piece, try moves
    const moves = [];
    for (let i = 0; i < SIZE; i++) for (let j = 0; j < SIZE; j++) {
      if (board[i][j] !== 2) continue;
      for (const [di, dj] of [[1,1],[1,-1],[-1,1],[-1,-1]]) {
        const ni = i+di, nj = j+dj;
        if (ni>=0 && ni<SIZE && nj>=0 && nj<SIZE && board[ni][nj] === 0) {
          moves.push({from:[i,j], to:[ni,nj]});
        }
        const mi = i+di, mj = j+dj, ti = i+2*di, tj = j+2*dj;
        if (ti>=0 && ti<SIZE && tj>=0 && tj<SIZE && board[mi][mj] === 1 && board[ti][tj] === 0) {
          moves.push({from:[i,j], to:[ti,tj], capture:[mi,mj]});
        }
      }
    }
    if (moves.length === 0) { turn = 1; document.getElementById('ckT').textContent = 'You'; return; }
    const m = moves[rand(0, moves.length-1)];
    board[m.to[0]][m.to[1]] = 2;
    board[m.from[0]][m.from[1]] = 0;
    if (m.capture) board[m.capture[0]][m.capture[1]] = 0;
    turn = 1;
    document.getElementById('ckT').textContent = 'You';
    render();
  }

  document.getElementById('ckReset').onclick = reset;
  reset();
};

// ---------- SUDOKU (Mini 4x4) ----------
gameFunctions.sudoku = function() {
  // Simple 4x4 sudoku
  const SOLUTION = [
    [1,2,3,4],
    [3,4,1,2],
    [2,1,4,3],
    [4,3,2,1]
  ];
  let puzzle, selected;

  setStats(`<div class="stat-box"><div class="label">Info</div><div class="value">4×4</div></div>`);
  setContainer(`
    <p style="color:#b8b8ff;margin-bottom:12px;">ہر row, column اور 2×2 box میں 1-4</p>
    <div id="sdBoard" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:320px;margin:15px auto;"></div>
    <div id="sdNums" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px 0;"></div>
    <button class="btn-action" id="sdReset">New Game</button>
  `);

  function reset() {
    puzzle = SOLUTION.map(r => r.map(v => Math.random() < 0.4 ? 0 : v));
    selected = null;
    render();
  }

  function render() {
    const b = document.getElementById('sdBoard');
    b.innerHTML = '';
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
      const cell = document.createElement('div');
      cell.className = 'cell-btn';
      cell.style.fontSize = '28px';
      cell.textContent = puzzle[i][j] || '';
      if (selected && selected[0] === i && selected[1] === j) cell.style.borderColor = '#00ffff';
      cell.onclick = () => { if (!puzzle[i][j]) { selected = [i, j]; render(); } };
      b.appendChild(cell);
    }
    const n = document.getElementById('sdNums');
    n.innerHTML = '';
    for (let i = 1; i <= 4; i++) {
      const btn = document.createElement('button');
      btn.className = 'btn-action';
      btn.textContent = i;
      btn.onclick = () => {
        if (!selected) return;
        const [r, c] = selected;
        puzzle[r][c] = i;
        selected = null;
        render();
        checkWin();
      };
      n.appendChild(btn);
    }
  }

  function checkWin() {
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) if (puzzle[i][j] !== SOLUTION[i][j]) return;
    showOverlay('🎉', 'Solved!', 'Sudoku مکمل!');
  }

  document.getElementById('sdReset').onclick = reset;
  reset();
};

// ---------- LIGHTS OUT ----------
gameFunctions.lightsout = function() {
  const SIZE = 5;
  let grid;

  setStats(`<div class="stat-box"><div class="label">Taps</div><div class="value" id="loT">0</div></div>`);
  setContainer(`
    <p style="color:#b8b8ff;margin-bottom:12px;">تمام لائٹس بند کریں!</p>
    <div id="loBoard" style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:340px;margin:15px auto;"></div>
    <button class="btn-action" id="loReset">New Game</button>
  `);

  function reset() {
    grid = Array(SIZE).fill().map(() => Array(SIZE).fill(0));
    // Random scramble
    for (let i = 0; i < 8; i++) {
      const r = rand(0, SIZE-1), c = rand(0, SIZE-1);
      toggle(r, c);
    }
    taps = 0;
    document.getElementById('loT').textContent = 0;
    render();
  }
  let taps = 0;

  function toggle(r, c) {
    for (const [dr, dc] of [[0,0],[1,0],[-1,0],[0,1],[0,-1]]) {
      const nr = r+dr, nc = c+dc;
      if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) grid[nr][nc] = 1 - grid[nr][nc];
    }
  }

  function render() {
    const b = document.getElementById('loBoard');
    b.innerHTML = '';
    for (let i = 0; i < SIZE; i++) for (let j = 0; j < SIZE; j++) {
      const cell = document.createElement('div');
      cell.className = 'cell-btn';
      cell.style.background = grid[i][j] ? 'linear-gradient(145deg,#ffd93d,#ff8c00)' : 'linear-gradient(145deg,#1a1a3e,#2a1a4e)';
      cell.style.boxShadow = grid[i][j] ? '0 0 20px #ffd93d' : '';
      cell.onclick = () => {
        toggle(i, j);
        taps++;
        document.getElementById('loT').textContent = taps;
        render();
        if (grid.flat().every(v => !v)) {
          setTimeout(() => showOverlay('💡', 'Solved!', `${taps} taps`), 300);
        }
      };
      b.appendChild(cell);
    }
  }

  document.getElementById('loReset').onclick = reset;
  reset();
};
